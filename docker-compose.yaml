services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - YOUR_ENV=development
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app  # для разработки - монтируем код
    command: fastapi dev src/api/main.py --host 0.0.0.0

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: crm-service
      POSTGRES_USER: tenngage
      POSTGRES_PASSWORD: 2531
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.0
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
